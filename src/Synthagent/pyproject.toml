[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Synthagent"
version = "1.0.0"
description = "Synthetic Data Generation and Auditing Pipeline"
dependencies = [
    "pandas",
    "dash",
    "dash-bootstrap-components",
    "scikit-learn",
    "xgboost",
    "fpdf",
    "jinja2",
    "numpy"
]

[tool.setuptools]
packages = ["synthagent", "services", "utils", "callbacks", "components"]
package-dir = {"" = "."}

[tool.pyright]
include = ["."]
extraPaths = ["."]

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]
ignore = ["D100", "D103"]
